<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Qui est la Queen 👑</title>

  <link rel="stylesheet" href="style.css" />

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@400;700;800;900&display=swap" rel="stylesheet">
</head>

<body>

<canvas id="confetti-canvas"></canvas>

<!-- HOME -->
<div id="screen-home" class="screen active">

  <div class="home-inner">

    <div class="hero">👑</div>

    <h1>Qui est la Queen ?</h1>

    <p class="subtitle">
      Version chaos — soirée entre potes 🍾
    </p>

    <div class="settings-card">

      <label class="toggle-row">
        <span>🎲 Mode soirée</span>

        <input type="checkbox" id="toggle-party">
      </label>

      <label class="toggle-row">
        <span>🔊 Sons</span>

        <input type="checkbox" checked id="toggle-sound">
      </label>

    </div>

    <button id="btn-start" class="btn-primary">
      Commencer 🚀
    </button>

    <button id="btn-manage" class="btn-secondary">
      👥 Liste des joueuses
    </button>

  </div>

</div>

<!-- SECRET -->
<div id="screen-secret" class="screen">

  <div class="secret-box">

    <div id="secret-avatar" class="big-avatar"></div>

    <h2 id="secret-name"></h2>

    <p id="secret-anecdote"></p>

    <button id="btn-secret-ok" class="btn-primary">
      J'ai vu 👀
    </button>

  </div>

</div>

<!-- GAME -->
<div id="screen-game" class="screen">

  <header>

    <button id="btn-home" class="icon-btn">🏠</button>

    <button id="btn-show-secret" class="icon-btn">
      👁️
    </button>

  </header>

  <div id="cards-grid" class="cards-grid"></div>

  <div class="bottom-zone">

    <div class="question-card">
      <p id="question-text">
        Appuie pour une question 🎲
      </p>
    </div>

    <button id="btn-question" class="btn-secondary">
      Nouvelle question
    </button>

    <button id="btn-guess" class="btn-primary">
      Je devine 🎯
    </button>

  </div>

</div>

<!-- WIN -->
<div id="screen-win" class="screen">

  <div class="result-box">

    <div class="hero">🏆</div>

    <h2>Bravo !</h2>

    <div id="win-avatar" class="big-avatar"></div>

    <h3 id="win-name"></h3>

    <button id="btn-replay" class="btn-primary">
      Rejouer 🔄
    </button>

  </div>

</div>

<!-- LOSE -->
<div id="screen-lose" class="screen">

  <div class="result-box">

    <div class="hero">😬</div>

    <h2>Raté !</h2>

    <div id="lose-avatar" class="big-avatar"></div>

    <h3 id="lose-name"></h3>

    <button id="btn-replay2" class="btn-primary">
      Rejouer 🔄
    </button>

  </div>

</div>

<!-- MODAL GUESS -->
<div id="modal-guess" class="modal hidden">

  <div class="modal-content">

    <h2>Qui est-ce ? 🎯</h2>

    <div id="guess-grid" class="guess-grid"></div>

  </div>

</div>

<!-- MODAL PLAYERS -->
<div id="modal-players" class="modal hidden">

  <div class="modal-content players-modal">

    <div class="players-header">

      <h2>👥 Joueuses</h2>

      <button id="btn-close-players" class="icon-btn">
        ✕
      </button>

    </div>

    <div id="players-list"></div>

    <button id="btn-add-player" class="floating-btn">
      +
    </button>

  </div>

</div>

<!-- MODAL FORM -->
<div id="modal-form" class="modal hidden">

  <div class="modal-content">

    <h2 id="form-title">
      Ajouter une joueuse
    </h2>

    <input
      type="text"
      id="input-name"
      placeholder="Prénom"
      class="input"
    >

    <textarea
      id="input-anecdote"
      placeholder="Anecdote"
      class="input"
    ></textarea>

    <input
      type="file"
      id="input-photo"
      accept="image/*"
      capture="environment"
      hidden
    >

    <button id="btn-photo" class="btn-secondary">
      📸 Ajouter une photo
    </button>

    <div id="photo-preview"></div>

    <button id="btn-save-player" class="btn-primary">
      Sauvegarder ✅
    </button>

    <button id="btn-cancel-player" class="btn-secondary">
      Annuler
    </button>

  </div>

</div>

<!-- TOAST -->
<div id="toast"></div>

<script src="script.js"></script>

</body>
</html>
